<!DOCTYPE html>
<html>
<head>
    <title>SecuGen Capture Success</title>
    <style>
        body { font-family: 'Inter', sans-serif; text-align: center; padding: 2rem; }
        .success-text { color: #065F46; font-weight: 700; font-size: 1.2rem; margin-bottom: 1rem; }
        .serial-box { background: #F8FAFC; border: 1px solid #E2E8F0; display: inline-block; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; color: #0A2A5E; margin-bottom: 1rem; }
        img { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-height: 150px; }
    </style>
</head>
<body>
    <div class="success-text">Fingerprint Scanned Successfully! ✅</div>
    
    {% if metadata %}
    <div class="serial-box">
        Device Serial Number: <span>{{ metadata.SerialNumber }}</span>
    </div>
    <br>
    <img src="data:image/bmp;base64,{{ metadata.BMPBase64 }}" alt="Fingerprint">
    
    <script>
        // Send success message and fingerprint template to the parent iframe (our Login UI)
        window.parent.postMessage({
            type: 'SECUGEN_SCAN_COMPLETE',
            serial: '{{ metadata.SerialNumber }}',
            template: '{{ metadata.TemplateBase64 }}'
        }, '*');
    </script>
    {% endif %}
</body>
</html>
